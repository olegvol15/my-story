# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review config. The project rules live in AGENTS.md; this file
# points CodeRabbit at them and adds per-path focus. Labels and PR-title rules
# are owned by .github/workflows/pr-labels.yml, so CodeRabbit's versions are off.
language: en-US
tone_instructions: "Direct and brief. Lead with the problem and the fix; skip praise and restating the diff."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords: ["wip"]

  path_filters:
    - "!package-lock.json"
    - "!dist/**"
    - "!.astro/**"
    - "!**/*.{png,jpg,jpeg,webp,gif,svg,ico}"

  path_instructions:
    - path: "**/*"
      instructions: |
        This is a deliberately lightweight static Astro site (see AGENTS.md). Flag anything that adds
        page weight or runtime cost without a clear reason: new dependencies, framework integrations,
        third-party scripts or embeds, client JS that isn't progressive enhancement, SSR/API routes.
    - path: "src/**/*.astro"
      instructions: |
        - Styles should be scoped and use the tokens in src/styles/tokens.css instead of raw colours or radii.
        - Elements from scripts or set:html need :global() with a comment explaining why.
        - Inline <script> must be progressive enhancement: the markup must work without it.
        - Images go through astro:assets <Image> with widths + sizes and meaningful alt text.
        - Accessibility: one <h1> per page, aria-labelledby on sections, visible focus, rel="noopener" on target="_blank".
        - Visible dates are wrapped in <time datetime> and formatted via src/lib/posts.ts helpers.
        - Entrance animations use data-reveal and --reveal-delay; don't bypass prefers-reduced-motion.
    - path: "src/{lib,pages}/**/*.ts"
      instructions: |
        Sorting, draft filtering and date formatting belong in src/lib/; flag duplicates of that logic in pages
        or components. Watch for timezone bugs in date handling (dates are YYYY-MM-DD, rendered in en-US).
    - path: "src/content.config.ts"
      instructions: |
        Schema changes must stay backwards compatible with existing content files, or the PR must update them.
        zod comes from "astro/zod".
    - path: "src/content/**/*.md"
      instructions: |
        This is the author's personal writing. Do NOT suggest rewording, style or tone changes.
        Only flag: typos, broken links or image paths, missing/empty alt text on images (including coverAlt
        when cover is set), invalid frontmatter against src/content.config.ts, and em dashes (the site uses " - ").
        For projects: changelog `shipped` entries need a date; `planned` items must not have one.
    - path: ".github/**"
      instructions: |
        CI must stay: npm ci -> npm run check -> npm run build. The job names "Check and build" and "PR title"
        are required status checks in the main branch ruleset; flag any rename. Keep workflow permissions minimal.
        If a new component or route is added elsewhere in the PR, check .github/labeler.yml covers its path.
    - path: "AGENTS.md"
      instructions: "Check that commands, paths and file names mentioned here actually exist in the repo."

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
  learnings:
    scope: local
