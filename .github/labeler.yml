# Path-based "area:" labels, applied by .github/workflows/pr-labels.yml.
# "type:" labels come from the PR title instead (see that workflow).

"area: writing":
  - changed-files:
      - any-glob-to-any-file:
          - src/content/writing/**
          - src/pages/writing/**
          - src/pages/rss.xml.ts
          - src/components/WritingList.astro
          - src/lib/posts.ts

